<!DOCTYPE html><html><head>
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta name="flutter-renderer" content="auto">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="A new Flutter project.">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="DaxarrowTeams">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <link rel="icon" type="image/png" href="icons/logo_dax.png">
    <title>DaxarrowTeams</title>
    <link rel="manifest" href="manifest.json">

  <!-- FCM Web Push: register BEFORE flutter_bootstrap so this worker wins over Flutter's caching SW.
       For production/hosted builds run: flutter build web --release --pwa-strategy=none
       (see build_web_for_fcm.bat). Otherwise Flutter may register flutter_service_worker.js at "/" and break push. -->
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;
      navigator.serviceWorker
        .register('/firebase-messaging-sw.js', { scope: '/', updateViaCache: 'none' })
        .then(function (reg) {
          console.log('[FCM] firebase-messaging-sw.js active:', reg.scope);
        })
        .catch(function (err) {
          console.error('[FCM] Service worker registration failed:', err);
        });
    })();
  </script>

  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #FFFFFF;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>

<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>

<script>
    // Foreground FCM: prefer the Notification API (works even if the wrong SW is active).
    // Foreground FCM while the tab is active (Flutter [onMessage] calls this).
    // Same icon/tag policy as firebase-messaging-sw.js — one visual identity, tag dedupes updates.
    window.showWebNotification = function (title, body, imageUrl, tag) {
      var t = title || 'Notification';
      var b = body || '';
      var tg = tag || 'fcm-foreground';
      var opts = {
        body: b,
        icon: '/icons/logo_dax.png',
        badge: '/icons/logo_dax.png',
        tag: tg,
        renotify: false,
      };
      if (imageUrl) {
        try {
          opts.image = imageUrl;
        } catch (e) {}
      }
      if ('Notification' in window && Notification.permission === 'granted') {
        try {
          var n = new Notification(t, opts);
          n.onclick = function () {
            window.focus();
            n.close();
          };
          return;
        } catch (e) {
          console.warn('[FCM] Notification() failed, falling back to SW:', e);
        }
      }
      if (!('serviceWorker' in navigator)) {
        console.warn('[FCM] No Notification permission and no service workers.');
        return;
      }
      navigator.serviceWorker.ready
        .then(function (registration) {
          return registration.showNotification(t, {
            body: b,
            icon: '/icons/logo_dax.png',
            badge: '/icons/logo_dax.png',
            image: imageUrl || undefined,
            vibrate: [200, 100, 200],
            tag: tg,
            renotify: false,
          });
        })
        .catch(function (err) {
          console.error('[FCM] showNotification via SW failed:', err);
        });
    };
</script>

<script>
  // #region agent log
  // Lightweight runtime logger for debug mode (no secrets/PII).
  window.__agentLog = function (payload) {
    try {
      fetch('http://127.0.0.1:7413/ingest/6f955913-4647-4fc8-9cb6-024e741bba9a', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Debug-Session-Id': '25d2da',
        },
        body: JSON.stringify(payload),
      }).catch(function () {});
    } catch (e) {}
  };
  // #endregion
</script>

<script>
  // flutter_native_splash injects this overlay; it only disappears when JS removes it.
  // Flutter dispatches this event after the first frame is rendered.
  window.addEventListener('flutter-first-frame', function () {
    removeSplashFromWeb();
  });
</script>
<script src="flutter_bootstrap.js" async=""></script>


</body></html>
