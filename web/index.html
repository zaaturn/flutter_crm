<!DOCTYPE html><html><head>
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta name="flutter-renderer" content="canvaskit">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="A new Flutter project.">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="DaxarrowTeams">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <link rel="icon" type="image/png" href="logo_dax.png">
    <title>DaxarrowTeams</title>
    <link rel="manifest" href="manifest.json">
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #0C0C0C;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
</head>

<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>

<script>
    // This function is called from your Flutter NotificationService
    window.showWebNotification = function(title, body) {
      console.log("Triggering Foreground Notification Bridge...");

      if (!('serviceWorker' in navigator)) {
        console.warn("Service Workers are not supported in this browser.");
        return;
      }
      navigator.serviceWorker.ready.then(function(registration) {
        registration.showNotification(title, {
          body: body,
          icon: '/icons/Icon-192.png',
          badge: '/icons/Icon-192.png', // The small icon in the Android status bar
          vibrate: [200, 100, 200],      // Essential for mobile user attention
          tag: 'foreground-alert',       // Prevents notification spamming by replacing existing ones
          renotify: true                 // Re-vibrate even if the tag is the same
        });
      }).catch(function(err) {
        console.error("Service Worker was not ready for notification:", err);
      });
    };
</script>

<script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        // Register the Firebase Messaging service worker
        navigator.serviceWorker.register('/firebase-messaging-sw.js', {
            scope: '/'
        }).then(function(reg) {
            console.log('Firebase Service Worker registered with scope:', reg.scope);
        }).catch(function(err) {
            console.error('Firebase Service Worker registration failed:', err);
        });
      });
    }
</script>

<script src="flutter_bootstrap.js" async=""></script>
