name: Deploy Flutter Web to Firebase

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --pwa-strategy=none --dart-define=BASE_URL=https://crm-application-zaaturn.up.railway.app

      # Flutter reuses asset file names on every build (the icon font is
      # trimmed to the icons in use), and Firebase caches /assets for a year.
      # Moving assets into a per-commit folder gives every deploy fresh URLs,
      # so browsers can never mix new code with an old cached icon font.
      - name: Version asset URLs
        run: |
          VER="${GITHUB_SHA::8}"
          mkdir -p "build/web/v/$VER"
          mv build/web/assets "build/web/v/$VER/assets"
          sed -i "s#__ASSET_BASE__#/v/$VER/#" build/web/flutter_bootstrap.js
          grep -q "/v/$VER/" build/web/flutter_bootstrap.js

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase
        run: |
          set +e
          output=$(firebase deploy --only hosting --non-interactive --token "${{ secrets.FIREBASE_TOKEN }}" 2>&1)
          exit_code=$?
          echo "$output"
          if [ "$exit_code" -eq 0 ]; then
            exit 0
          fi
          if echo "$output" | grep -q "is the current active version"; then
            echo "Hosting already serves this build. Skipping release (not a failure)."
            exit 0
          fi
          exit "$exit_code"
