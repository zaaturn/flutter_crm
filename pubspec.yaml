name: my_app
description: "A new Flutter project for Zaaturn."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  http: ^1.1.0
  cross_file: ^0.3.4+2
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  flutter_secure_storage: ^9.0.0
  intl: ^0.19.0
  file_picker: ^8.0.5
  printing: ^5.12.0
  share_plus: ^10.0.2
  dio: ^5.4.0
  path_provider: ^2.1.3
  url_launcher: ^6.2.6
  open_filex: ^4.6.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.1.2
  table_calendar: ^3.1.2
  flutter_dotenv: ^5.1.0
  dartz: ^0.10.1
  get_it: ^7.7.0
  bloc: ^8.1.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  go_router: ^14.6.2
  web_socket_channel: ^3.0.1
  connectivity_plus: ^6.1.0
  hive_flutter: ^1.1.0
  uuid: ^4.5.1
  flutter_dropzone: ^4.2.1
  desktop_drop: ^0.5.0
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Tools for App Icon and Native Splash
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/login_bg.jpeg
    - assets/images/daxarrow.png
    - assets/images/logo.png
    - assets/images/share_bg.png

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
    - family: DMMono
      fonts:
        - asset: assets/fonts/DMMono-Regular.ttf
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
    - family: NotoSansSymbols2
      fonts:
        - asset: assets/fonts/NotoSansSymbols2-Regular.ttf

# ═══════════════════════════════════════════════════
#  APP ICON CONFIGURATION (Home Screen)
# ═══════════════════════════════════════════════════
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/logo.png"

# ═══════════════════════════════════════════════════
#  NATIVE SPLASH CONFIGURATION (Removes Blue Logo)
# ═══════════════════════════════════════════════════
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo.png

  android: true
  ios: true
  fullscreen: true

  android_12:
    image: assets/images/logo.png
    color: "#FFFFFF"